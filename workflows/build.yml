name: Compilar LimpaRAM

# Roda sempre que o código em src/ mudar, ou manualmente pela aba Actions
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Compilar LimpaRAM.exe
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /platform:anycpu /win32manifest:src\app.manifest /out:LimpaRAM.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll src\LimpaRAM.cs

      - name: Publicar nova versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" LimpaRAM.exe \
            --title "LimpaRAM $TAG" \
            --notes "Versão compilada automaticamente a partir do código em src/."
